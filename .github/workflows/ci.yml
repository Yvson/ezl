name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck -x -e SC1091 install.sh lib/*.sh modules/*.sh bin/ezl

  install-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -y
          apt-get install -y git curl sudo
      - uses: actions/checkout@v4
        with:
          path: ezl
      - name: Run installer (skip docker in CI — no systemd)
        working-directory: ezl
        run: |
          ./install.sh --yes --skip 30-docker
      - name: Verify tools (skip docker module checks)
        working-directory: ezl
        run: |
          # set PATH manually (zshrc can't be sourced from bash — oh-my-zsh errors)
          export PATH="$HOME/.sdkman/candidates/java/current/bin:$PATH"
          export PATH="$HOME/.sdkman/candidates/maven/current/bin:$PATH"
          export PATH="$HOME/.sdkman/candidates/gradle/current/bin:$PATH"
          export PATH="$HOME/.nvm/versions/node/v24.20.0/bin:$PATH"
          export PATH="$HOME/.pyenv/shims:$PATH"
          export PATH="$HOME/.dotnet:$PATH"
          export PATH="/usr/local/go/bin:$PATH"
          EZL_HOME="$PWD" bin/ezl verify || true
          # docker/lazydocker will fail since we skipped 30-docker in CI
          git --version
          gh --version
          node --version
          python --version
          dotnet --version
          go version
          java -version 2>&1 | head -1
