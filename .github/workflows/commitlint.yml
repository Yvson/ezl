name: Commit Lint

on: [pull_request]

permissions:
  pull-requests: write

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-dev @commitlint/cli @commitlint/config-conventional
      - name: Lint PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint
